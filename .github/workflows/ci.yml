name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  installation-test:
    name: Installation Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Verify Python version
      run: |
        python --version
        python -c "import sys; assert sys.version_info >= (3, 12), f'Python 3.12+ required, got {sys.version}'"

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"

    - name: Build package
      run: |
        uv build

    - name: Install package from wheel
      run: |
        uv pip install dist/*.whl

    - name: CLI extra smoke (Typer entry + import)
      run: |
        WHEEL="$(ls dist/*.whl | head -n 1)"
        uv pip install "${WHEEL}[cli]"
        ungraph --help
        python -c "from ungraph.cli.main import app"
        uv pip install pytest
        pytest tests/unit/test_cli_smoke_unit.py -v

    - name: Run critical packaging test
      run: |
        python -c "import ungraph; print('configure:', ungraph.configure)"

    - name: Run installation smoke test
      run: |
        python scripts/smoke_test_installation.py

    - name: Run installation unit tests
      run: |
        uv pip install pytest
        pytest tests/test_installation.py -v

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Verify Python version
      run: |
        python --version
        python -c "import sys; assert sys.version_info >= (3, 12), f'Python 3.12+ required, got {sys.version}'"

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv pip install pytest pytest-cov pytest-mock
        uv pip install -e .

    - name: Run unit tests
      run: |
        pytest tests/ -v -m "not integration and not e2e" --cov=ungraph --cov-report=term-missing --cov-report=xml

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      continue-on-error: true
      with:
        file: ./coverage.xml
        flags: unit
        name: unit-tests-${{ matrix.python-version }}

  eti-measurable:
    name: ETI measurable (unit + offline DoE smoke)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"

    - name: Install package with experiments extra
      run: |
        uv pip install pytest pyyaml
        uv pip install -e ".[experiments]"

    - name: ETI unit suite (no Neo4j)
      run: |
        pytest \
          tests/unit/test_experiment_run_doe_unit.py \
          tests/unit/test_doe_bridge_unit.py \
          tests/unit/test_probe_qa_eval_unit.py \
          tests/unit/test_scorecard_unit.py \
          tests/unit/test_capa0_artifact_unit.py \
          tests/unit/test_family_wave_unit.py \
          tests/unit/test_chunk_wave_unit.py \
          tests/unit/test_neo4j_gold_metrics_unit.py \
          tests/unit/test_lexical_pattern_inference_unit.py \
          tests/unit/test_domain_pipeline_offline_unit.py \
          tests/unit/test_composition_root_settings_unit.py \
          tests/unit/test_extraction_deepeval_unit.py \
          tests/unit/test_complexity_export_unit.py \
          -v -m "unit or not integration" --tb=short

    - name: Offline DoE smoke (screening + run, no Neo4j)
      run: |
        python scripts/run_domain_pipeline.py --domain knowledge_graphs --design screening --mode offline --redesign
        python scripts/run_domain_pipeline.py --domain knowledge_graphs --design run --mode offline
        test -f benchmarks/domains/knowledge_graphs/reports/results.csv
        test -f benchmarks/domains/knowledge_graphs/reports/summary.json

  integration-tests:
    name: Integration & E2E (Neo4j)
    runs-on: ubuntu-latest
    env:
      UNGRAPH_NEO4J_URI: bolt://localhost:7687
      UNGRAPH_NEO4J_USER: neo4j
      UNGRAPH_NEO4J_PASSWORD: testpassword123
      UNGRAPH_NEO4J_DATABASE: neo4j
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: testpassword123

    services:
      neo4j:
        image: neo4j:5.15-community
        env:
          NEO4J_AUTH: neo4j/testpassword123
          NEO4J_PLUGINS: '["apoc"]'
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword123 -a bolt://localhost:7687 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Verify Python version
      run: |
        python --version
        python -c "import sys; assert sys.version_info >= (3, 12), f'Python 3.12+ required, got {sys.version}'"

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv pip install pytest pytest-cov pytest-mock pytest-timeout
        uv pip install -e ".[infer-en]"
        python -m spacy download en_core_web_sm

    - name: Wait for Neo4j to be ready
      run: |
        python scripts/wait_for_neo4j.py --uri bolt://localhost:7687 --user neo4j --password testpassword123 --timeout 120

    - name: NER factory smoke
      run: |
        pytest tests/integration/test_ner_smoke_integration.py -v -m integration --tb=short --timeout=120

    - name: Run integration tests
      run: |
        pytest tests/ -v -m integration --tb=short --timeout=300 --timeout-method=thread

    - name: Run E2E tests (ingest → search)
      run: |
        pytest tests/ -v -m e2e --tb=short --timeout=300 --timeout-method=thread

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Verify Python version
      run: |
        python --version
        python -c "import sys; assert sys.version_info >= (3, 12), f'Python 3.12+ required, got {sys.version}'"

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"

    - name: Install linting tools
      run: |
        uv pip install flake8 black isort mypy

    - name: Run flake8
      run: |
        flake8 ungraph/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 ungraph/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        flake8 tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # black/isort: limitado a tests/ hasta un formateo masivo de ungraph/ (evitar romper CI).
    - name: Check formatting with black
      run: |
        black --check tests/

    - name: Check imports with isort
      run: |
        isort --check-only tests/
