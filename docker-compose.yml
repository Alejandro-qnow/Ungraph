# Neo4j opcional: solo si no tienes otra instancia. Si Neo4j ya está arriba, no uses esto.
# Uso: docker compose up -d
# URI: bolt://localhost:7687  usuario: neo4j  contraseña: ungraphlocal123
services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/ungraphlocal123
      NEO4J_PLUGINS: '["apoc"]'
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "ungraphlocal123", "-a", "bolt://127.0.0.1:7687", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 40s
